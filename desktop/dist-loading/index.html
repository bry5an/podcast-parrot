<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kotoba</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        background: #1c1c1e;
        color: #f2f2f7;
      }
      #starting {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(242, 242, 247, 0.25);
        border-top-color: #f2f2f7;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #error {
        display: none;
        flex-direction: column;
        gap: 12px;
        max-width: 640px;
        padding: 32px;
      }
      #error h1 {
        margin: 0;
        font-size: 18px;
      }
      #error p {
        margin: 0;
        opacity: 0.8;
        font-size: 14px;
      }
      #error pre {
        margin: 0;
        max-height: 240px;
        overflow: auto;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 12px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      body.error #starting {
        display: none;
      }
      body.error #error {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="starting">
      <div class="spinner"></div>
      <div>Starting Kotoba…</div>
    </div>
    <div id="error">
      <h1 id="error-title">Kotoba couldn't start</h1>
      <p id="error-message"></p>
      <pre id="error-detail"></pre>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.get("error") === "1") {
        document.body.classList.add("error");
        document.getElementById("error-message").textContent =
          params.get("message") || "The backend process failed to start.";
        document.getElementById("error-detail").textContent = params.get("detail") || "";
      }
    </script>
  </body>
</html>
