name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # app.main only registers "/" (index.html with the auth token injected)
      # when frontend/dist exists — tests/integration/test_health_and_auth.py
      # exercises that route, so it needs a real build present, not just the
      # backend's own deps.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked

      - run: uv run pytest

      - run: uv run ruff check .

  frontend:
    name: Frontend (build + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm run test

  changes:
    name: Detect macOS-relevant changes
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # A tag push always builds; a PR only builds the macOS job if it
      # touches the code that job actually exercises — a full Tauri build on
      # every PR (docs, CI-only changes, etc.) is slow enough to be annoying.
      - name: Check whether backend/, desktop/, or frontend/ changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | grep -qE '^(backend|desktop|frontend)/'; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS (Tauri build + smoke test)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Rust toolchain and cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: macos-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-cargo-

      # whisper-cli is built from source, statically, by prepare_sidecars.sh
      # below (#62) — cmake is the only extra tool needed; ggml-org/whisper.cpp
      # is fetched at a pinned tag by that script, not installed via Homebrew.
      - name: Install cmake
        run: brew install cmake

      # Cache keyed on prepare_sidecars.sh (which pins the whisper.cpp ref and
      # cmake flags) so a from-scratch clone/configure/build only happens when
      # that pin changes, not on every run.
      - name: Cache whisper.cpp source + build
        uses: actions/cache@v6.1.0
        with:
          path: .cache/whisper-cpp
          key: macos-whispercpp-${{ hashFiles('desktop/scripts/prepare_sidecars.sh') }}
          restore-keys: |
            macos-whispercpp-

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build sidecars (PyInstaller backend + whisper-cli from source)
        run: ./desktop/scripts/prepare_sidecars.sh

      # Not `npx tauri` (the README's local-dev shorthand) — that only
      # resolves correctly on machines that already have @tauri-apps/cli
      # installed globally. A fresh runner has no such global install, so
      # bare `npx tauri` would instead fetch the unrelated, long-abandoned
      # `tauri` npm package (last released in 2021) and fail.
      - name: Build the Tauri app + dmg
        working-directory: desktop
        run: npx --yes --package @tauri-apps/cli@2.11.4 tauri build -b app dmg

      # Launches the bundle's actual embedded binary and asserts /api/health
      # responds, so a broken kotoba-backend.spec / bundle.macOS.files
      # mapping fails CI instead of only surfacing on someone's install.
      - name: Smoke test the bundled backend
        run: ./desktop/scripts/smoke_test.sh desktop/src-tauri/target/release/bundle/macos/Ausculto.app

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kotoba-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
