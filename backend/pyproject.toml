[project]
name = "kotoba-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.7",
    "feedparser>=6.0.12",
    "fugashi>=1.5.2",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.51.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends(...) default-argument pattern
    "UP042", # str+Enum members are used for SQLModel/JSON (de)serialization
]
